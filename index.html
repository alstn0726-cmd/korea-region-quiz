<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f6fa">
<title>대한민국 지역 찾기 v5.4</title>
<style>
:root{
  --bg:#f3f6fa;--panel:#fff;--ink:#182033;--muted:#6d7788;
  --accent:#315fe6;--good:#1b8c4c;--bad:#c53a3a;--sea:#eaf4fb
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:var(--bg);color:var(--ink)
}
button{font:inherit}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:10px 14px;background:#fff;border-bottom:1px solid #e2e7ee
}
h1{margin:0;font-size:20px}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.count{background:#eef2f7;border-radius:999px;padding:8px 12px;font-weight:850;white-space:nowrap}

main{
  min-height:0;display:grid;
  grid-template-columns:minmax(0,2.2fr) minmax(330px,1fr);
  gap:12px;padding:12px
}
.panel{
  min-height:0;background:#fff;border-radius:18px;overflow:hidden;
  box-shadow:0 2px 12px #18203312
}
.mapPanel{position:relative;background:var(--sea);touch-action:none}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none}

.region{
  fill:#fff;stroke:#98a6b8;stroke-width:.65;
  vector-effect:non-scaling-stroke;cursor:pointer
}
.region:hover{fill:#f6f8ff}
.region.placed{fill:#e5e7eb}
.region.good{fill:#dff5e7;stroke:var(--good);stroke-width:1.7}
.region.bad{fill:#fde5e5;stroke:var(--bad);stroke-width:1.7}

.label,.answer{
  pointer-events:none;text-anchor:middle;dominant-baseline:middle;
  paint-order:stroke;stroke:#fff;stroke-linejoin:round
}
.label{font-size:7px;font-weight:650;fill:#566477;stroke-width:2.2px}
.metro{font-size:9px;font-weight:900;fill:#334155;stroke-width:3px}
.answer{font-size:8px;font-weight:900;fill:#244599;stroke-width:2.8px}

.help{
  position:absolute;left:12px;top:12px;z-index:3;
  background:#fffffff2;border-radius:12px;padding:9px 11px;
  font-size:12px;line-height:1.52;box-shadow:0 2px 8px #0001
}
.zoom{
  position:absolute;right:12px;top:12px;display:grid;gap:6px;z-index:3
}
.zoom button{
  width:42px;height:42px;border:0;border-radius:12px;background:#fff;
  font-size:20px;font-weight:900;box-shadow:0 2px 8px #0002
}
.loading{
  position:absolute;inset:0;display:grid;place-items:center;
  text-align:center;background:var(--sea);font-weight:800;z-index:5;padding:24px
}
.mapHint{
  position:absolute;left:12px;bottom:12px;z-index:3;
  background:#fffffff0;border-radius:10px;padding:7px 10px;
  font-size:11px;color:#5f6c7f;box-shadow:0 2px 8px #0001
}

.side{display:grid;grid-template-rows:auto auto 1fr auto}
.sideHead{padding:15px 15px 7px}
.sideHead div{font-size:11px;color:var(--muted);margin-top:4px}
.selection{
  margin:0 14px 9px;padding:11px;border-radius:12px;background:#f2f5f9;
  min-height:44px;font-size:13px;line-height:1.45
}
.selection strong{color:var(--accent)}
.cards{
  overflow:auto;-webkit-overflow-scrolling:touch;
  display:grid;grid-template-columns:1fr 1fr;gap:7px;
  padding:5px 11px 12px;align-content:start
}
.card{
  border:1px solid #d6dce7;background:#fff;border-radius:11px;
  min-height:42px;padding:8px 4px;font-weight:800;color:#263247
}
.card.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card.used{opacity:.3}
.actions{
  display:grid;grid-template-columns:1fr 1.45fr;gap:8px;
  padding:11px;border-top:1px solid #e4e8ef
}
.btn{border:0;border-radius:12px;padding:13px 8px;font-weight:900}
.secondary{background:#edf0f5}
.primary{background:var(--accent);color:#fff}
.primary:disabled{opacity:.35}

.modal{
  position:fixed;inset:0;display:none;place-items:center;
  background:#0c121f75;z-index:20
}
.modal.show{display:grid}
.box{
  background:#fff;border-radius:24px;padding:28px;text-align:center;
  width:min(430px,90vw);animation:pop .35s ease-out
}
.score{font-size:58px;font-weight:950;margin:8px}
.box button{
  border:0;border-radius:12px;background:var(--accent);color:#fff;
  padding:12px 16px;font-weight:900
}
@keyframes pop{
  0%{transform:scale(.7);opacity:0}
  80%{transform:scale(1.05)}
  100%{transform:scale(1)}
}
@media(max-width:850px){
  main{grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr)}
  .label{font-size:6.5px}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div>
    <h1>🇰🇷 대한민국 지역 찾기</h1>
    <div class="sub">v5.4 · 광역시는 행정코드로 내부 구 완전 제거 · 배치 지역은 연한 회색</div>
  </div>
  <div class="count"><span id="count">0</span> / 40 배치</div>
</header>

<main>
<section class="panel mapPanel">
  <svg id="map" viewBox="0 0 760 900" aria-label="대한민국 시군 백지도">
    <g id="viewport">
      <g id="regions"></g>
      <g id="labels"></g>
      <g id="answers"></g>
    </g>
  </svg>

  <div class="help">
    ① 오른쪽에서 <b>지역 이름 터치</b><br>
    ② 지도에서 <b>해당 시·군 터치</b><br>
    <b>구 단위는 표시하지 않습니다.</b>
  </div>

  <div class="zoom">
    <button id="zi" aria-label="확대">＋</button>
    <button id="zo" aria-label="축소">−</button>
    <button id="zr" aria-label="초기화">⌂</button>
  </div>

  <div class="mapHint">두 손가락: 확대·축소 · 한 손가락 드래그: 이동</div>
  <div class="loading" id="loading">시·군 경계를 만드는 중…</div>
</section>

<section class="panel side">
  <div class="sideHead">
    <b>지역 이름 40개</b>
    <div>배치 중에는 정답 여부를 알려주지 않습니다.</div>
  </div>
  <div class="selection" id="selection">먼저 지역 이름을 선택하세요.</div>
  <div class="cards" id="cards"></div>
  <div class="actions">
    <button class="btn secondary" id="reset">처음부터</button>
    <button class="btn primary" id="check" disabled>✨ 결과 확인 ✨</button>
  </div>
</section>
</main>
</div>

<div class="modal" id="modal">
  <div class="box">
    <b>🎉 결과 발표!</b>
    <div class="score"><span id="score">0</span><small style="font-size:22px"> / 40</small></div>
    <p id="msg"></p>
    <button id="close">지도에서 확인하기</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/dist/polygon-clipping.umd.min.js"></script>
<script>
"use strict";

const TOP40=[
  "수원시","용인시","고양시","화성시","창원시","성남시","청주시","부천시","남양주시","천안시",
  "전주시","안산시","평택시","시흥시","김해시","파주시","김포시","포항시","의정부시","아산시",
  "광주시","구미시","원주시","양산시","진주시","하남시","제주시","양주시","춘천시","광명시",
  "순천시","익산시","경산시","군산시","여수시","경주시","오산시","거제시","이천시","충주시"
];

const SGG_URLS=[
  "https://cdn.jsdelivr.net/gh/DevMinGeonPark/mapcn-kr@main/data/sgg.json",
  "https://raw.githubusercontent.com/DevMinGeonPark/mapcn-kr/main/data/sgg.json"
];

const SIDO_URLS=[
  "https://cdn.jsdelivr.net/gh/DevMinGeonPark/mapcn-kr@main/data/sido.json",
  "https://raw.githubusercontent.com/DevMinGeonPark/mapcn-kr/main/data/sido.json"
];

const METRO_SIDOS=new Set([
  "서울특별시",
  "부산광역시",
  "대구광역시",
  "인천광역시",
  "광주광역시",
  "대전광역시",
  "울산광역시",
  "세종특별자치시"
]);

const METRO_PREFIXES=new Set(["11","26","27","28","29","30","31","36"]);

const METRO_LABELS={
  "서울특별시":"서울특별시",
  "부산광역시":"부산광역시",
  "대구광역시":"대구광역시",
  "인천광역시":"인천광역시",
  "광주광역시":"광주광역시",
  "대전광역시":"대전광역시",
  "울산광역시":"울산광역시",
  "세종특별자치시":"세종특별자치시"
};

const NS="http://www.w3.org/2000/svg";

let groups=new Map();
let selected=null;
let placements=new Map();
let checked=false;
let projection=null;

let scale=1,tx=0,ty=0;
let pointers=new Map();
let pinchStartDist=0;
let pinchStartScale=1;
let pinchStartMid=null;
let panStart=null;
let panStartTx=0,panStartTy=0;
let gestureMoved=false;
let suppressClickUntil=0;

const svg=document.getElementById("map");
const viewport=document.getElementById("viewport");
const regionsG=document.getElementById("regions");
const labelsG=document.getElementById("labels");
const answersG=document.getElementById("answers");
const cardsEl=document.getElementById("cards");
const selectionEl=document.getElementById("selection");
const countEl=document.getElementById("count");
const checkBtn=document.getElementById("check");

function sggName(p){
  return String(p.sggnm||p.SGG_NM||p.name||p.adm_nm||"").trim();
}
function sidoName(p){
  return String(p.sidonm||p.SIDO_NM||p.sido_nm||p.sido||"").trim();
}

/* 핵심 규칙
   1) 특별시·광역시는 모든 자치구를 광역단위 하나로 통합
   2) 일반시의 행정구는 공백 유무와 무관하게 시 하나로 통합
      포항시북구 / 포항시 북구 / 청주시흥덕구 / 수원시장안구 → 각각 포항시/청주시/수원시
*/
function regionKey(raw,sido){
  if(METRO_SIDOS.has(sido)) return sido;
  const m=raw.match(/^(.+?시)\s*.+구$/);
  return m ? m[1] : raw;
}

function walkCoords(geom,fn){
  function walk(v){
    if(Array.isArray(v)&&typeof v[0]==="number"){fn(v);return}
    if(Array.isArray(v))v.forEach(walk);
  }
  walk(geom.coordinates);
}

function makeProjection(features){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  features.forEach(f=>walkCoords(f.geometry,([x,y])=>{
    minX=Math.min(minX,x);maxX=Math.max(maxX,x);
    minY=Math.min(minY,y);maxY=Math.max(maxY,y);
  }));
  const pad=24,W=760,H=900;
  const s=Math.min((W-pad*2)/(maxX-minX),(H-pad*2)/(maxY-minY));
  return ([x,y])=>[pad+(x-minX)*s,H-pad-(y-minY)*s];
}

function asMulti(geom){
  if(geom.type==="Polygon") return [geom.coordinates];
  if(geom.type==="MultiPolygon") return geom.coordinates;
  return [];
}

function dissolve(features){
  const polys=features.map(f=>asMulti(f.geometry));
  const unioned=polygonClipping.union(...polys);
  return {type:"MultiPolygon",coordinates:unioned};
}

function ringPath(ring){
  return ring.map((c,i)=>{
    const [x,y]=projection(c);
    return (i?"L":"M")+x.toFixed(2)+","+y.toFixed(2);
  }).join("")+"Z";
}

function geomPath(geom){
  return geom.coordinates.flatMap(poly=>poly.map(ringPath)).join("");
}

function groupCenter(features){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  features.forEach(f=>walkCoords(f.geometry,c=>{
    const [x,y]=projection(c);
    minX=Math.min(minX,x);maxX=Math.max(maxX,x);
    minY=Math.min(minY,y);maxY=Math.max(maxY,y);
  }));
  return [(minX+maxX)/2,(minY+maxY)/2];
}

async function fetchOne(urls){
  let last;
  for(const url of urls){
    try{
      const r=await fetch(url,{cache:"no-store",mode:"cors"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const data=await r.json();
      if(!data || !Array.isArray(data.features)) throw new Error("GeoJSON 형식 오류");
      return data;
    }catch(e){last=e}
  }
  throw last;
}

async function fetchGeo(){
  const [sgg,sido]=await Promise.all([
    fetchOne(SGG_URLS),
    fetchOne(SIDO_URLS)
  ]);
  return {sgg,sido};
}

async function init(){
  if(typeof polygonClipping==="undefined"){
    throw new Error("도형 병합 라이브러리를 불러오지 못했습니다.");
  }

  const data=await fetchGeo();

  function sidoCodeOf(p){
    const direct=String(p.sido||p.SIDO||"").trim();
    if(direct) return direct.slice(0,2);
    const sgg=String(p.sgg||p.SGG||p.adm_cd||"").trim();
    return sgg.slice(0,2);
  }

  // 특별시/광역시/세종은 sido.json의 '전체 시도 경계'만 사용한다.
  const metroFeatures=data.sido.features.filter(f=>{
    const p=f.properties||{};
    const code=sidoCodeOf(p);
    const name=String(p.sidonm||p.SIDO_NM||"").trim();
    return METRO_PREFIXES.has(code) || METRO_SIDOS.has(name);
  });

  // 핵심: sgg.json에서 광역단위 코드(11,26,27,28,29,30,31,36)는
  // 무조건 제외한다. 광주 29xxx의 광산구/북구/남구/동구/서구가
  // 이 단계에서 지도 데이터 자체에서 제거된다.
  const localFeatures=data.sgg.features.filter(f=>{
    const p=f.properties||{};
    const code=sidoCodeOf(p);
    const name=String(p.sidonm||p.SIDO_NM||"").trim();
    return !METRO_PREFIXES.has(code) && !METRO_SIDOS.has(name);
  });

  const features=[...localFeatures,...metroFeatures];
  projection=makeProjection(features);

  features.forEach(f=>{
    const p=f.properties||{};
    const sido=sidoName(p);
    const code=sidoCodeOf(p);

    let raw;
    let key;

    if(METRO_PREFIXES.has(code) || METRO_SIDOS.has(sido)){
      raw=sido || ({
        "11":"서울특별시","26":"부산광역시","27":"대구광역시","28":"인천광역시",
        "29":"광주광역시","30":"대전광역시","31":"울산광역시","36":"세종특별자치시"
      }[code]);
      key=raw;
    }else{
      raw=sggName(p);
      if(!raw)return;
      key=regionKey(raw,sido);
    }

    if(!groups.has(key)){
      groups.set(key,{
        features:[],
        paths:[],
        label:METRO_LABELS[key]||key
      });
    }
    groups.get(key).features.push(f);
  });

  groups.forEach((g,key)=>{
    g.geometry = g.features.length===1
      ? (g.features[0].geometry.type==="Polygon"
          ? {type:"MultiPolygon",coordinates:[g.features[0].geometry.coordinates]}
          : g.features[0].geometry)
      : dissolve(g.features);

    g.center=groupCenter(g.features);

    const path=document.createElementNS(NS,"path");
    path.setAttribute("d",geomPath(g.geometry));
    path.setAttribute("class","region");
    path.dataset.key=key;
    path.addEventListener("click",e=>{
      e.stopPropagation();
      if(Date.now()<suppressClickUntil)return;
      placeAt(key);
    });
    regionsG.appendChild(path);
    g.paths=[path];

    if(!TOP40.includes(key)){
      const t=document.createElementNS(NS,"text");
      t.setAttribute("x",g.center[0]);
      t.setAttribute("y",g.center[1]);
      t.setAttribute("class","label"+(METRO_LABELS[key]?" metro":""));
      t.textContent=g.label;
      labelsG.appendChild(t);
    }
  });

  document.getElementById("loading").remove();
}

function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}

function buildCards(){
  cardsEl.innerHTML="";
  shuffle(TOP40).forEach(name=>{
    const b=document.createElement("button");
    b.className="card";
    b.dataset.name=name;
    b.textContent=name;
    b.onclick=()=>{
      if(checked)return;
      if(placements.has(name))placements.delete(name);
      selected=name;
      drawAnswers();
      updateUI();
      selectionEl.innerHTML=`선택: <strong>${name}</strong> → 지도에서 해당 시를 터치하세요.`;
    };
    cardsEl.appendChild(b);
  });
}

function placeAt(key){
  if(checked){
    const e=[...placements.entries()].find(([,v])=>v===key);
    if(e){
      selectionEl.innerHTML=e[0]===key
        ? `✅ <strong>${e[0]}</strong> — 정답`
        : `❌ 내가 넣은 답: <strong>${e[0]}</strong><br>정답: <strong>${key}</strong>`;
    }
    return;
  }
  if(!selected)return;

  for(const[q,v]of[...placements]){
    if(v===key)placements.delete(q);
  }
  placements.set(selected,key);
  selected=null;
  drawAnswers();
  updateUI();
  selectionEl.textContent="배치했습니다. 다음 지역을 선택하세요.";
}

function refreshPlacementFills(){
  groups.forEach(g=>g.paths.forEach(p=>p.classList.remove("placed")));
  if(checked)return;
  const occupied=new Set(placements.values());
  occupied.forEach(key=>{
    const g=groups.get(key);
    if(g)g.paths.forEach(p=>p.classList.add("placed"));
  });
}

function drawAnswers(){
  refreshPlacementFills();
  answersG.innerHTML="";
  placements.forEach((key,q)=>{
    const g=groups.get(key);
    if(!g)return;

    const t=document.createElementNS(NS,"text");
    t.setAttribute("x",g.center[0]);
    t.setAttribute("y",g.center[1]);
    t.setAttribute("class","answer");
    t.textContent=q;
    answersG.appendChild(t);
  });
}

function updateUI(){
  [...cardsEl.children].forEach(b=>{
    b.classList.toggle("active",b.dataset.name===selected);
    b.classList.toggle("used",placements.has(b.dataset.name)&&b.dataset.name!==selected);
  });
  countEl.textContent=placements.size;
  checkBtn.disabled=checked||placements.size!==40;
}

function scoreGame(){
  checked=true;
  let score=0;

  groups.forEach(g=>g.paths.forEach(p=>p.classList.remove("placed","good","bad")));

  placements.forEach((key,q)=>{
    const ok=key===q;
    if(ok)score++;

    const g=groups.get(key);
    if(g)g.paths[0].classList.add(ok?"good":"bad");
  });

  document.getElementById("score").textContent=score;
  document.getElementById("msg").textContent=
    score===40
      ? "완벽해요! 40곳을 모두 맞혔습니다."
      : "초록색은 정답, 빨간색은 오답입니다.";
  document.getElementById("modal").classList.add("show");
  updateUI();
}

function resetGame(){
  checked=false;
  selected=null;
  placements.clear();
  groups.forEach(g=>g.paths.forEach(p=>p.classList.remove("placed","good","bad")));
  buildCards();
  drawAnswers();
  updateUI();
  selectionEl.textContent="먼저 지역 이름을 선택하세요.";
}

/* ---------- 지도 확대/이동 ---------- */

function applyTransform(){
  viewport.setAttribute("transform",`translate(${tx} ${ty}) scale(${scale})`);
}

function clampScale(v){
  return Math.max(1,Math.min(5,v));
}

function zoomAt(factor,cx=380,cy=450){
  const old=scale;
  const next=clampScale(scale*factor);
  if(next===old)return;

  const ratio=next/old;
  tx=cx-(cx-tx)*ratio;
  ty=cy-(cy-ty)*ratio;
  scale=next;

  if(scale===1){tx=0;ty=0}
  applyTransform();
}

function clientToSvg(clientX,clientY){
  const r=svg.getBoundingClientRect();
  return {
    x:(clientX-r.left)/r.width*760,
    y:(clientY-r.top)/r.height*900
  };
}

function getPointerArray(){
  return [...pointers.values()];
}

svg.addEventListener("pointerdown",e=>{
  svg.setPointerCapture?.(e.pointerId);

  const p=clientToSvg(e.clientX,e.clientY);
  pointers.set(e.pointerId,p);
  gestureMoved=false;

  if(pointers.size===1){
    panStart=p;
    panStartTx=tx;
    panStartTy=ty;
  }else if(pointers.size===2){
    const [a,b]=getPointerArray();
    pinchStartDist=Math.hypot(a.x-b.x,a.y-b.y);
    pinchStartScale=scale;
    pinchStartMid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  }
},{passive:false});

svg.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;

  const p=clientToSvg(e.clientX,e.clientY);
  pointers.set(e.pointerId,p);

  if(pointers.size>=2){
    const [a,b]=getPointerArray();
    const dist=Math.hypot(a.x-b.x,a.y-b.y);
    const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};

    if(Math.abs(dist-pinchStartDist)>2)gestureMoved=true;

    const desired=clampScale(pinchStartScale*(dist/pinchStartDist));
    const factor=desired/scale;
    zoomAt(factor,mid.x,mid.y);

    if(pinchStartMid){
      tx+=mid.x-pinchStartMid.x;
      ty+=mid.y-pinchStartMid.y;
      pinchStartMid=mid;
      applyTransform();
    }
    e.preventDefault();
    return;
  }

  if(pointers.size===1 && panStart && scale>1){
    const dx=p.x-panStart.x;
    const dy=p.y-panStart.y;

    if(Math.hypot(dx,dy)>5)gestureMoved=true;

    tx=panStartTx+dx;
    ty=panStartTy+dy;
    applyTransform();
    e.preventDefault();
  }
},{passive:false});

function endPointer(e){
  if(gestureMoved)suppressClickUntil=Date.now()+300;
  pointers.delete(e.pointerId);

  if(pointers.size===1){
    const [p]=getPointerArray();
    panStart=p;
    panStartTx=tx;
    panStartTy=ty;
  }else{
    panStart=null;
  }

  if(pointers.size<2){
    pinchStartDist=0;
    pinchStartMid=null;
  }
}

svg.addEventListener("pointerup",endPointer);
svg.addEventListener("pointercancel",endPointer);

svg.addEventListener("wheel",e=>{
  e.preventDefault();
  const p=clientToSvg(e.clientX,e.clientY);
  zoomAt(e.deltaY<0?1.15:1/1.15,p.x,p.y);
},{passive:false});

document.getElementById("zi").onclick=()=>zoomAt(1.3);
document.getElementById("zo").onclick=()=>zoomAt(1/1.3);
document.getElementById("zr").onclick=()=>{
  scale=1;tx=0;ty=0;applyTransform();
};

document.getElementById("check").onclick=scoreGame;
document.getElementById("reset").onclick=resetGame;
document.getElementById("close").onclick=()=>{
  document.getElementById("modal").classList.remove("show");
};

buildCards();
updateUI();

init().catch(e=>{
  document.getElementById("loading").innerHTML=
    "지도를 불러오지 못했습니다.<br><small>"+e.message+"</small>";
});
</script>
